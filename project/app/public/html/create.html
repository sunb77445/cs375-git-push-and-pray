<!DOCTYPE html>
<html>
    <head>
    <title>Create a New Trip</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="banner-container">

        <form action="../dashboard.html"><button type="submit">Back to Dashboard</button></form>


        <div class="step-container" id="step1">
            <h2>Step 1</h2>

            <p>Where would you like to go?</p>
            <input class="required" id="city" type="text" placeholder="City">
            <input id="state" type="text" placeholder="State (U.S Only)">
            <input class="required" id="country" type="text" placeholder="Country">
        

            <p>Where are you coming from?</p>
            <input class="required" id="fromCity" type="text" placeholder="City">
            <input class="required" id="fromState" type="text" placeholder="State">

            <p>How many travelers?</p>
            <input class="required" id="travelers" type="number" min="1" max = "8" placeholder="# ">
        
            <p>What dates would you like to travel?</p>
            <input class="required" id="fromDate" type="date"  >
            <input class="required" id="toDate" type="date">

    
            <p>What's your budget?</p>
            <input class="required" id="budget" type="number" placeholder="Enter Budget">

            <div class="button">
                <button id="next-button" disabled>Next</button>
            </div>
        </div>

         <div class="step-container slide-in-box" id="step2"  style="opacity: 0; transform: translateX(-100%);"> <!-- style="visibility: hidden" -->
             <h2>Step 2</h2>
             <p>What would you like to prioritize in your budget?</p>



            <div class="slider-container">
                <input class="slider" id="food" type="range" min="0" max="100" value="33.3"> 
                <span id="food-value">33%</span>
                <label for="food">Food</label>
            </div>

            <div class="slider-container">
                <input class="slider" id="accomodations" type="range" min="0" max="100" value="33.3">
                <span id="accomodations-value">33%</span>
                <label for="accomodations">Hotels</label>
            </div>
       
            <div class="slider-container">
                <input class="slider" id="flights" type="range" min="0" max="100" value="33.3">
                <span id="flights-value">33%</span>
                <label for="flights">Flights</label>
            </div>

            <div class="button">
                <button id="submit">Done!</button>
            </div>
        </div>


         <script src="../js/hotels.js"></script>
         <script src="../js/create.js"></script>
    </div>
</body>

</html>
