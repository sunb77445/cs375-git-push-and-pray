<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

    <header>

        <h1>Travel Planner</h1>


        <div class="header-buttons">

            <button id="friendButton">👥</button>

            <div id="friendDropdown" class="friend-dropdown">

                <h3>Friends</h3>

                <div id="friendsList">
                    <p>Loading friends...</p>
                </div>

                <hr>

                <h3>Add Friend</h3>

                <input
                    type="text"
                    id="friendUsername"
                    placeholder="Enter Username"
                >

                <button id="searchFriendButton">
                    Search
                </button>

                <div id="friendResult"></div>

            </div>

            <button id="notificationButton">🔔</button>

            <div id="notificationDropdown" class="notification-dropdown">

                <h3>Notifications</h3>

                <div id="notificationsList">
                    <p>No notifications.</p>
                </div>

            </div>
            
            <div class="user-menu">
                <button id="userButton">👤</button>

                <div id="userDropdown" class="user-dropdown">
                    <p><strong>Username:</strong> <span id="username"></span></p>
                    <p><strong>First Name:</strong> <span id="firstName"></span></p>
                    <p><strong>Last Name:</strong> <span id="lastName"></span></p>
                    <p><strong>Email:</strong> <span id="email"></span></p>

                    <button id="logoutButton">Logout</button>
                </div>
            </div>
        </div>

    </header>


    <main>

        <div class="dashboard-top">

            <h2>My Travel Plans</h2>

            <button id="createPlanButton">
                + Create Plan
            </button>

        </div>


        <section id="travelPlans">

            <div class="plan-placeholder">
                <h3>No Travel Plans Yet</h3>
                <p>Create a plan to get started.</p>
            </div>

        </section>

    </main>

    <script>

        async function loadCurrentUser() {
            const response = await fetch("/current-user");
            const data = await response.json();

            if (!data.loggedIn) {
                window.location.href = "login.html";
                return;
            }

            document.querySelector("h1").textContent =
                data.user.username + "'s Travel Planner";

            document.getElementById("username").textContent =
                data.user.username;

            document.getElementById("firstName").textContent =
                data.user.first_name;

            document.getElementById("lastName").textContent =
                data.user.last_name;

            document.getElementById("email").textContent =
                data.user.email;
        }


        document.getElementById("userButton").addEventListener("click", function() {
            document.getElementById("userDropdown").classList.toggle("show");
        });

        document.getElementById("friendButton").addEventListener("click", async function() {
            document.getElementById("friendDropdown").classList.toggle("show");
            await loadFriends();
        });

        document.getElementById("notificationButton")
            .addEventListener("click", async function() {

                document
                    .getElementById("notificationDropdown")
                    .classList.toggle("show");

                await loadNotifications();
            });


        document.getElementById("logoutButton")
            .addEventListener("click", async function() {

                const response = await fetch("/logout", {
                    method: "POST"
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = "login.html";
                }
            });


        document.getElementById("createPlanButton")
            .addEventListener("click", function() {

                window.location.href = "create.html";
            });


        document.getElementById("searchFriendButton")
            .addEventListener("click", async function() {

                const username =
                    document.getElementById("friendUsername").value.trim();

                const result =
                    document.getElementById("friendResult");

                if (!username) {
                    result.innerHTML = "<p>Please enter a username.</p>";
                    return;
                }

                try {
                    const response = await fetch(
                        "/users/" + encodeURIComponent(username)
                    );

                    const data = await response.json();

                    if (!data.success) {
                        result.innerHTML = `<p>${data.message}</p>`;
                        return;
                    }

                    result.innerHTML = `
                        <p>
                            ${data.user.username}
                            (${data.user.first_name} ${data.user.last_name})
                        </p>

                        <button id="addFriendButton">
                            Add Friend
                        </button>
                    `;

                    document.getElementById("addFriendButton")
                        .addEventListener("click", async function() {

                            const response = await fetch(
                                "/friends/request",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({
                                        receiverId: data.user.id
                                    })
                                }
                            );

                            const result = await response.json();

                            document.getElementById("friendResult").innerHTML =
                                `<p>${result.message}</p>`;
                        });

                } catch (error) {
                    console.error(error);
                    result.innerHTML =
                        "<p>Something went wrong.</p>";
                }
            });


        async function markNotificationAsRead(notificationId) {
            try {
                const response = await fetch(
                    `/notifications/${notificationId}/read`,
                    {
                        method: "POST"
                    }
                );

                const data = await response.json();

                if (data.success) {
                    await loadNotifications();
                }

            } catch (error) {
                console.error("Could not mark notification as read:", error);
            }
        }

        async function loadNotifications() {

            try {

                const response = await fetch("/notifications");
                const data = await response.json();

                if (!data.success) {
                    return;
                }

                const list =
                    document.getElementById("notificationsList");

                const notificationButton =
                    document.getElementById("notificationButton");

                const unreadCount = data.notifications.length;

                if (unreadCount > 0) {
                    notificationButton.classList.add("has-notifications");
                } else {
                    notificationButton.classList.remove("has-notifications");
                }

                if (data.notifications.length === 0) {
                    list.innerHTML = "<p>No notifications.</p>";
                    return;
                }

                list.innerHTML = "";

                data.notifications.forEach(notification => {

                    const notificationElement =
                        document.createElement("div");

                    notificationElement.classList.add("notification-item");

                    if (notification.type === "friend_request") {

                        notificationElement.innerHTML = `
                            <p>${notification.message}</p>

                            <div class="friend-request-buttons">

                                <button
                                    class="acceptButton"
                                    data-id="${notification.friend_request_id}">
                                    O
                                </button>

                                <button
                                    class="declineButton"
                                    data-id="${notification.friend_request_id}">
                                    X
                                </button>

                            </div>
                        `;

                    } else {

                        notificationElement.innerHTML = `
                            <p>${notification.message}</p>
                        `;

                        notificationElement.addEventListener(
                            "click",
                            async function() {

                                await markNotificationAsRead(notification.id);

                            }
                        );

                    }

                    list.appendChild(notificationElement);

                });


                document
                    .querySelectorAll(".acceptButton")
                    .forEach(button => {

                        button.addEventListener(
                            "click",
                            async function() {

                                const requestId = this.dataset.id;

                                const response = await fetch(
                                    `/friends/requests/${requestId}/accept`,
                                    {
                                        method: "POST"
                                    }
                                );

                                const result = await response.json();

                                if (!result.success) {
                                    alert(result.message);
                                    return;
                                }

                                await loadNotifications();
                                await loadFriends();

                            }
                        );

                    });


                document
                    .querySelectorAll(".declineButton")
                    .forEach(button => {

                        button.addEventListener(
                            "click",
                            async function() {

                                const requestId = this.dataset.id;

                                const response = await fetch(
                                    `/friends/requests/${requestId}/decline`,
                                    {
                                        method: "POST"
                                    }
                                );

                                const result = await response.json();

                                if (!result.success) {
                                    alert(result.message);
                                    return;
                                }

                                await loadNotifications();
                                await loadFriends();

                            }
                        );

                    });

            } catch (error) {

                console.error(
                    "Could not load notifications:",
                    error
                );

            }
        }

        async function loadFriends() {
            try {

                const response = await fetch("/friends");
                const data = await response.json();

                const list = document.getElementById("friendsList");

                if (!data.success) {
                    list.innerHTML = `<p>${data.message}</p>`;
                    return;
                }

                if (data.friends.length === 0) {
                    list.innerHTML = "<p>No friends yet.</p>";
                    return;
                }

                list.innerHTML = "";

                data.friends.forEach(friend => {

                    const friendElement = document.createElement("div");

                    friendElement.classList.add("friend-item");

                    friendElement.innerHTML = `
                        <p>
                            <strong>${friend.username}</strong>
                            <br>
                            ${friend.first_name} ${friend.last_name}
                        </p>
                    `;

                    list.appendChild(friendElement);
                });

            } catch (error) {

                console.error("Could not load friends:", error);

                document.getElementById("friendsList").innerHTML =
                    "<p>Could not load friends.</p>";
            }
        }


        loadCurrentUser();
        loadNotifications();

        setInterval(loadNotifications, 5000);

        // TO DO: add fetch call/api endpoint to database for dynamically rendering saved trips
        // server should validate user and then return trips saved in db correlating to that user_id
        // use response to build front end
    </script>

</body>

</html>
