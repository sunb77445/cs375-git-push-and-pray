<!DOCTYPE html>
<html>
       <head>
            <title>View Trip</title>
            <link rel="stylesheet" href="/css/styles.css">
            <link rel="stylesheet" href="/css/dashboard.css">
        </head>
        
    <body class="banner-page">

        <img src="/images/paris.jpg" alt="Image of Paris skyline" class="full-width-img">

        <div class="banner-container">
            <form action="dashboard.html">
                <button class="pointed-left" type="submit" id ="back"> Back to Dashboard</button>
            </form>
            <h1 id="dest"> Trip to City, Country</h1>
            <p id="dates">From MM/DD/YYY to MM/DD/YYY</p>
            <p id="creator">Created By </p>

            <h2>Hotel</h2>
            <div id="hotel-list" class="saved-hotel-list"></div>
            <h2 id="flight">Flight </h2>
            <h2 id="food">Restaurants</h2>
            <div id="restaurant-list" class="saved-hotel-list"></div>


            <h4> Trip Members</h4>
            <ul id="member-list"> </ul>

            <button id="open-add"> Add User </button>
            <button id = "propose-vote-button">Propose Vote</button>

            <dialog id="dialog">
                <h2>Add a Friend to Your Trip!</h2>

                <select id="friendSelect" class="friend-search-input">
                    <option value="">Select a friend</option>
                </select>

                <div id="tripMemberResult" class="friend-search-result"></div>

                <button id="addFriendToTripButton" class="friend-search-button">
                    Add to Trip
                </button>
                <button id="exit">&times;</button>
            </dialog>

            <dialog id="vote-dialog" class="vote-dialog">
                <button id="vote-exit">[X]</button>
                <h2>Vote on a Hotel</h2>
                <p id="vote-status"></p>
                <div id="vote-options"></div>
            </dialog>

        </div>

        <script src="/js/hotels.js"></script>
        <script src="/js/trip.js"></script>
        <script src="/js/vote.js"></script>
    </body>

</html>
